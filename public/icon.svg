<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0e2e"/>
      <stop offset="35%" stop-color="#2a1640"/>
      <stop offset="65%" stop-color="#321c4a"/>
      <stop offset="100%" stop-color="#1e1030"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8894e"/>
      <stop offset="25%" stop-color="#d4a86a"/>
      <stop offset="50%" stop-color="#f0d8a0"/>
      <stop offset="75%" stop-color="#d4a86a"/>
      <stop offset="100%" stop-color="#a07840"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0dca8"/>
      <stop offset="20%" stop-color="#c8a870"/>
      <stop offset="40%" stop-color="#e8d0a0"/>
      <stop offset="55%" stop-color="#b89060"/>
      <stop offset="75%" stop-color="#d0b888"/>
      <stop offset="100%" stop-color="#a88050"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8a060"/>
      <stop offset="30%" stop-color="#e8c888"/>
      <stop offset="50%" stop-color="#f5e0b0"/>
      <stop offset="70%" stop-color="#d0a868"/>
      <stop offset="100%" stop-color="#a88048"/>
    </linearGradient>
    <linearGradient id="glassHL" x1="50%" y1="0%" x2="50%" y2="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="innerGlow" cx="50%" cy="45%" r="40%" fx="50%" fy="35%"
      gradientUnits="userSpaceOnUse" x1="256" y1="140" x2="256" y2="370">
      <stop offset="0%" stop-color="#4a2870" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1a0e2e" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ringGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="textGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="roundRect">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle inner radial glow behind the ring -->
  <circle cx="256" cy="250" r="160" fill="#3a1e58" opacity="0.4"/>
  <circle cx="256" cy="240" r="120" fill="#4a2870" opacity="0.25"/>

  <!-- Gold ring with glow -->
  <g filter="url(#ringGlow)">
    <circle cx="256" cy="250" r="148" fill="none" stroke="url(#goldRing)" stroke-width="2.5" opacity="0.9"/>
    <circle cx="256" cy="250" r="145" fill="none" stroke="url(#goldRing)" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- ══ GEOMETRIC CRYSTAL WREATH ══ -->
  <g filter="url(#glow)" opacity="0.85">

    <!-- Top-left leaf cluster -->
    <polygon points="148,155 128,120 145,108 158,140" fill="url(#gold)" opacity="0.75"/>
    <polygon points="138,138 112,115 130,98 150,128" fill="url(#gold)" opacity="0.6"/>
    <polygon points="160,138 148,100 165,92 170,128" fill="url(#gold)" opacity="0.7"/>
    <polygon points="130,155 108,138 118,122 142,145" fill="url(#gold)" opacity="0.5"/>

    <!-- Top crystal -->
    <polygon points="210,108 200,72 220,60 225,95" fill="url(#gold)" opacity="0.7"/>
    <polygon points="225,100 220,68 238,58 235,90" fill="url(#gold)" opacity="0.6"/>

    <!-- Top-center leaves -->
    <polygon points="245,95 240,58 256,45 260,82" fill="url(#gold)" opacity="0.8"/>
    <polygon points="267,95 272,58 256,45 252,82" fill="url(#gold)" opacity="0.8"/>

    <!-- Top-right crystals -->
    <polygon points="288,100 292,68 274,58 277,90" fill="url(#gold)" opacity="0.6"/>
    <polygon points="302,108 312,72 292,60 287,95" fill="url(#gold)" opacity="0.7"/>

    <!-- Top-right leaf cluster -->
    <polygon points="364,155 384,120 367,108 354,140" fill="url(#gold)" opacity="0.75"/>
    <polygon points="374,138 400,115 382,98 362,128" fill="url(#gold)" opacity="0.6"/>
    <polygon points="352,138 364,100 347,92 342,128" fill="url(#gold)" opacity="0.7"/>
    <polygon points="382,155 404,138 394,122 370,145" fill="url(#gold)" opacity="0.5"/>

    <!-- Right side leaves -->
    <polygon points="400,185 426,170 430,190 408,198" fill="url(#gold)" opacity="0.65"/>
    <polygon points="408,215 438,208 440,228 412,228" fill="url(#gold)" opacity="0.6"/>
    <polygon points="410,248 442,245 442,265 412,258" fill="url(#gold)" opacity="0.55"/>
    <polygon points="408,280 438,282 436,302 410,290" fill="url(#gold)" opacity="0.5"/>
    <polygon points="400,310 424,318 418,338 398,325" fill="url(#gold)" opacity="0.55"/>

    <!-- Bottom-right leaf cluster -->
    <polygon points="374,350 394,378 378,388 360,365" fill="url(#gold)" opacity="0.7"/>
    <polygon points="360,365 384,390 370,400 348,378" fill="url(#gold)" opacity="0.6"/>
    <polygon points="345,378 362,405 345,412 335,388" fill="url(#gold)" opacity="0.65"/>

    <!-- Bottom crystals -->
    <polygon points="310,395 318,425 298,435 295,405" fill="url(#gold)" opacity="0.6"/>
    <polygon points="280,402 284,432 268,438 270,410" fill="url(#gold)" opacity="0.7"/>

    <!-- Bottom-center -->
    <polygon points="265,408 268,440 256,448 252,415" fill="url(#gold)" opacity="0.75"/>
    <polygon points="247,408 244,440 256,448 260,415" fill="url(#gold)" opacity="0.75"/>

    <!-- Bottom-left crystals -->
    <polygon points="232,402 228,432 244,438 242,410" fill="url(#gold)" opacity="0.7"/>
    <polygon points="202,395 194,425 214,435 217,405" fill="url(#gold)" opacity="0.6"/>

    <!-- Bottom-left leaf cluster -->
    <polygon points="138,350 118,378 134,388 152,365" fill="url(#gold)" opacity="0.7"/>
    <polygon points="152,365 128,390 142,400 164,378" fill="url(#gold)" opacity="0.6"/>
    <polygon points="167,378 150,405 167,412 177,388" fill="url(#gold)" opacity="0.65"/>

    <!-- Left side leaves -->
    <polygon points="112,185 86,170 82,190 104,198" fill="url(#gold)" opacity="0.65"/>
    <polygon points="104,215 74,208 72,228 100,228" fill="url(#gold)" opacity="0.6"/>
    <polygon points="102,248 70,245 70,265 100,258" fill="url(#gold)" opacity="0.55"/>
    <polygon points="104,280 74,282 76,302 102,290" fill="url(#gold)" opacity="0.5"/>
    <polygon points="112,310 88,318 94,338 114,325" fill="url(#gold)" opacity="0.55"/>

    <!-- Diamond accents at cardinal points -->
    <polygon points="256,90 262,100 256,110 250,100" fill="url(#gold)" opacity="0.6"/>
    <polygon points="410,250 400,256 410,262 420,256" fill="url(#gold)" opacity="0.5"/>
    <polygon points="256,400 262,410 256,420 250,410" fill="url(#gold)" opacity="0.6"/>
    <polygon points="102,250 112,256 102,262 92,256" fill="url(#gold)" opacity="0.5"/>
  </g>

  <!-- Main text RG -->
  <g filter="url(#textShadow)">
    <text x="256" y="285" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
      font-size="148" font-weight="bold" letter-spacing="6" fill="url(#goldText)">RG</text>
  </g>
  <!-- Text highlight shimmer -->
  <text x="256" y="285" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
    font-size="148" font-weight="bold" letter-spacing="6" fill="#ffffff" opacity="0.08">RG</text>

  <!-- BEAUTY tagline -->
  <text x="256" y="340" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
    font-size="28" letter-spacing="14" fill="url(#gold)" opacity="0.55">BEAUTY</text>

  <!-- Glass highlight overlay (top-left to center) -->
  <path d="M48,0 L512,0 L512,220 Q400,280 200,200 Q80,160 0,100 L0,48 Q0,0 48,0Z"
    fill="url(#glassHL)" clip-path="url(#roundRect)"/>
</svg>
